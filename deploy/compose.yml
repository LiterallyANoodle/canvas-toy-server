# Dragon Mail for Coyote's /etc/docker/containers/docker-compose.yml (T-0049).
# Paste the service in. Needs, in the compose .env:
#   DRAGONMAIL_DB_PASSWORD=...   (the dragonmail role's password, set in psql)
#   DRAGONMAIL_DISCORD_WEBHOOK=https://discord.com/api/webhooks/...   (optional)
#   DRAGONMAIL_ACCESS_AUD=...      (the Access application's AUD tag; /admin is off without it)
#   DRAGONMAIL_ADMIN_EMAILS=you@example.com   (optional: only these may use /admin)
# One-time: mkdir -p /dragon_pool/media/dragon-mail/images && chown 10001:10001 /dragon_pool/media/dragon-mail/images
# Caddy: canvas.noodledragon.fans { reverse_proxy dragon-mail:8000 }
# Cloudflare Access: a self-hosted application for canvas.noodledragon.fans, path admin.
services:
  dragon-mail:
    image: ghcr.io/literallyanoodle/dragon-mail:latest
    container_name: dragon-mail
    restart: unless-stopped
    depends_on: [postgres]
    networks: [caddy]          # no published ports: only Caddy reaches it
    environment:
      - DB_HOST=postgres
      - DB_NAME=dragonmail
      - DB_USER=dragonmail
      - DB_PASSWORD=${DRAGONMAIL_DB_PASSWORD}
      - DISCORD_WEBHOOK_URL=${DRAGONMAIL_DISCORD_WEBHOOK}
      - PUBLIC_BASE_URL=https://canvas.noodledragon.fans
      - CF_ACCESS_TEAM_DOMAIN=noodledragon.cloudflareaccess.com
      - CF_ACCESS_AUD=${DRAGONMAIL_ACCESS_AUD:-}
      - ADMIN_EMAILS=${DRAGONMAIL_ADMIN_EMAILS:-}
    volumes:
      - /dragon_pool/media/dragon-mail/images:/data/images
